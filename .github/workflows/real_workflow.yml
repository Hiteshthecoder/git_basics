name: real_workflow

on: push

jobs:
    check_presence:
        runs-on: ubuntu-latest
        steps:
            - name: download code
              uses: actions/checkout@v4

            - name: check if file exists
              run: test -f index.js

    validate-files:
        runs-on: ubuntu-latest
        needs: [check_presence]
        steps:
            - name: download code
              uses: actions/checkout@v4

            - name: download nodejs
              uses: actions/setup-node@v4
              with: 
                node-version: 22.0.0
                cache: npm

            - name: check javascript code
              run: node --check index.js